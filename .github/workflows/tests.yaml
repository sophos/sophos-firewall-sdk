# Linters and unit tests across supported Python versions
name: Linters and Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:
    # Python 3.9 has no setup-python builds on Ubuntu 26.04 (ubuntu-latest).
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Install poetry
      run: pipx install poetry
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'poetry'
    - name: Install dependencies
      run: |
        poetry install --with dev,docs
    - name: Black formatting
      run: |
        poetry run black sophosfirewall_python/
    - name: Pylint
      run: |
        poetry run pylint sophosfirewall_python/firewallapi.py -vvv
    - name: Pytest
      run: |
        poetry run pytest sophosfirewall_python/tests/unittests.py
    - name: Bandit
      run: |
        poetry run bandit sophosfirewall_python/firewallapi.py
